version: 2
project_name: vio

builds:
  - id: vio
    main: ./cmd/vio
    binary: vio
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ThembinkosiThemba/vio/internal/version.Version={{ .Version }}
      - -X github.com/ThembinkosiThemba/vio/internal/version.Commit={{ .Commit }}
      - -X github.com/ThembinkosiThemba/vio/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
      - --yes
    artifacts: checksum

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]
